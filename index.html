<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gapcon Payroll</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23132238'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-size='36' font-weight='600' fill='%23f4f1ea'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&display=swap">
  <style>
    :root {
      --paper: #f4f1ea;
      --ink: #132238;
      --rule: #c9c2b4;
      --accent: #9a6b2f;
      --selection: #e4dccb;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0f1a2b;
        --ink: #efe9dc;
        --rule: #35465e;
        --accent: #c99a5a;
        --selection: #27405f;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      font-optical-sizing: auto;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 0 16px;
    }
    ::selection { background: var(--selection); color: var(--ink); }
    main {
      display: grid;
      justify-items: center;
      gap: 1.25rem;
      text-align: center;
      transform: translateY(-4vh);
      animation: rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .mark {
      width: 2.25rem;
      height: 2.25rem;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      position: relative;
      opacity: 0.9;
    }
    .mark::after {
      content: "";
      position: absolute;
      inset: 50% auto auto 50%;
      width: 0.75rem;
      height: 0.75rem;
      background: var(--accent);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    h1 {
      margin: 0;
      font-weight: 500;
      font-size: clamp(2.5rem, 7.5vw, 5.5rem);
      line-height: 1;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }
    .rule {
      width: 3rem;
      height: 1px;
      background: var(--rule);
      margin-top: 0.5rem;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(calc(-4vh + 10px)); filter: blur(6px); }
      to   { opacity: 1; transform: translateY(-4vh); filter: blur(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Gapcon Payroll</h1>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
