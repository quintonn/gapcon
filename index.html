<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gapcon Payroll</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%230b1f3a'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-size='34' font-weight='700' fill='%23eef1f5'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600&family=Cormorant+Garamond:wght@600&display=swap">
  <style>
    :root {
      --navy: #0b1f3a;
      --white: #ffffff;
      --grotesk: "Archivo", "Helvetica Neue", Arial, sans-serif;
      --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--white);
      color: var(--navy);
      font-family: var(--grotesk);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    ::selection { background: #1b3a6b; color: #fff; }
    h1 { margin: 0; font-weight: inherit; font-size: inherit; line-height: inherit; }
    main {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 6vw;
      overflow: hidden;
      text-transform: uppercase;
    }
    .mono {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font: 600 clamp(14rem, 46vw, 38rem)/1 var(--serif);
      color: #eceef2;
      letter-spacing: -0.04em;
      user-select: none;
    }
    h1 {
      position: relative;
      font: 600 clamp(1.1rem, 2.6vw, 2rem)/1.3 var(--grotesk);
      letter-spacing: 0.24em;
      text-indent: 0.24em;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <div class="mono" aria-hidden="true">GP</div>
    <h1>Gapcon Payroll</h1>
  </main>
</body>
</html>
